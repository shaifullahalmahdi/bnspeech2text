<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Text & Refiner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #fff;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        #startBtn { background-color: #27ae60; }
        #stopBtn { background-color: #c0392b; }
        #refineBtn { background-color: #2980b9; width: 100%; margin-bottom: 10px; }
        #clearBtn { background-color: #7f8c8d; width: 100%; }
        
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
        }
        .status {
            text-align: center;
            font-style: italic;
            color: #e67e22;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ Voice to Text & Refiner</h2>
    
    <div class="control-group">
        <label for="languageSelect">Select Language:</label>
        <select id="languageSelect">
            <option value="bn-BD" selected>Bengali (বাংলা)</option>
            <option value="en-US">English (US)</option>
            <option value="hi-IN">Hindi (हिन्दी)</option>
        </select>
    </div>

    <div class="status" id="statusText">Status: Ready to start...</div>
    
    <div class="btn-container">
        <button id="startBtn" onclick="startRecording()">Start Recording</button>
        <button id="stopBtn" onclick="stopRecording()">Stop</button>
    </div>

    <h3>📝 Refine and Edit Text:</h3>
    <textarea id="outputBox" placeholder="Your speech will appear here. You can also manually edit or use the refine button below..."></textarea>
    
    <br><br>
    <button id="refineBtn" onclick="refineText()">✨ Clean & Refine Spacing/Punctuation</button>
    <button id="clearBtn" onclick="clearText()">Clear All</button>
</div>

<script>
    const outputBox = document.getElementById('outputBox');
    const statusText = document.getElementById('statusText');
    const languageSelect = document.getElementById('languageSelect');
    
    let recognition;
    let manualStop = false; 
    let finalTranscriptBackup = "";

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        
        recognition.continuous = true;
        recognition.interimResults = true; // লাইভ লেখার জন্য ইন্টারিম অন রাখা হলো

        recognition.onstart = function() {
            statusText.innerHTML = "🔴 Status: Recording in progress...";
        };

        recognition.onresult = function(event) {
            let interimTranscript = '';
            let currentFinal = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    currentFinal += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            if (currentFinal) {
                finalTranscriptBackup += currentFinal + " ";
            }

            // লাইভ টেক্সট বক্স আপডেট করা যাতে থেমে যাওয়ার সমস্যা না হয়
            outputBox.value = finalTranscriptBackup + interimTranscript;
        };

        recognition.onerror = function(event) {
            console.log("Error: " + event.error);
        };

        // ব্রাউজার কোনো কারণে অটো-স্টপ করলে যেন রিস্টার্ট হয়ে যায়
        recognition.onend = function() {
            if (!manualStop) {
                try {
                    recognition.lang = languageSelect.value;
                    recognition.start();
                } catch (e) {
                    console.log(e);
                }
            } else {
                statusText.innerHTML = "Status: Recording stopped.";
            }
        };

    } else {
        statusText.innerHTML = "❌ Your browser does not support voice recognition.";
    }

    function startRecording() {
        if (recognition) {
            manualStop = false;
            finalTranscriptBackup = outputBox.value; // আগের লেখা সেভ রাখা
            try {
                recognition.lang = languageSelect.value;
                recognition.start();
            } catch (e) {
                // রানিং থাকলে ইগনোর করবে
            }
        }
    }

    function stopRecording() {
        if (recognition) {
            manualStop = true;
            recognition.stop();
            statusText.innerHTML = "Status: Recording stopped.";
        }
    }

    // অতিরিক্ত স্পেস ও এলোমেলো ডবল শব্দ রিফাইন বা ক্লিন করার ফাংশন
    function refineText() {
        let text = outputBox.value;
        // অতিরিক্ত ডবল স্পেস বা ভুল ডুপ্লিকেট শব্দ ক্লিন করা
        text = text.replace(/\s+/g, ' ').trim();
        outputBox.value = text;
        finalTranscriptBackup = text;
        statusText.innerHTML = "Status: Text refined successfully!";
    }

    function clearText() {
        outputBox.value = "";
        finalTranscriptBackup = "";
        statusText.innerHTML = "Status: Text cleared.";
    }
</script>

</body>
</html>
