<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Text Recorder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #fff;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        #startBtn { background-color: #27ae60; }
        #stopBtn { background-color: #c0392b; display: none; }
        #refineBtn { background-color: #2980b9; width: 100%; margin-bottom: 10px; }
        #clearBtn { background-color: #7f8c8d; width: 100%; }
        
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            resize: vertical;
        }
        .status {
            text-align: center;
            font-style: italic;
            color: #e67e22;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ Voice to Text Recorder</h2>
    
    <div class="control-group">
        <label for="languageSelect">Select Language:</label>
        <select id="languageSelect">
            <option value="bn-BD" selected>Bengali (বাংলা)</option>
            <option value="en-US">English (US)</option>
            <option value="hi-IN">Hindi (हिन्दी)</option>
        </select>
    </div>

    <div class="status" id="statusText">Status: Ready... Click Start to speak.</div>
    
    <div class="btn-container">
        <button id="startBtn" onclick="startRecording()">Start Recording</button>
        <button id="stopBtn" onclick="stopRecording()">Stop Recording</button>
    </div>

    <h3>📝 Refine and Edit Text:</h3>
    <textarea id="outputBox" placeholder="Your speech will appear here..."></textarea>
    
    <br><br>
    <button id="refineBtn" onclick="refineText()">✨ Clean Spacing & Duplicates</button>
    <button id="clearBtn" onclick="clearText()">Clear All</button>
</div>

<script>
    const outputBox = document.getElementById('outputBox');
    const statusText = document.getElementById('statusText');
    const languageSelect = document.getElementById('languageSelect');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    
    let recognition;
    let finalTranscript = "";
    let isManualStop = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        
        // সেশন যেন নিজে নিজে বারবার রিস্টার্ট না হয়ে একবারে চলে
        recognition.continuous = true;
        recognition.interimResults = false; // লেখা ডবল হওয়া রোধ করতে ফলস রাখা হয়েছে

        recognition.onstart = function() {
            statusText.innerHTML = "🔴 Recording in progress... Speak now.";
            startBtn.style.display = "none";
            stopBtn.style.display = "block";
        };

        recognition.onresult = function(event) {
            let currentText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    currentText += event.results[i][0].transcript + " ";
                }
            }
            if (currentText.trim() !== "") {
                finalTranscript += currentText;
                outputBox.value = finalTranscript;
            }
        };

        recognition.onerror = function(event) {
            console.log("Error: " + event.error);
        };

        recognition.onend = function() {
            // ব্যবহারকারী নিজে স্টপ না করলে এবং ব্রাউজার হঠাৎ বন্ধ করলে এটি আবার সেশন ধরে রাখবে
            if (!isManualStop) {
                try {
                    recognition.lang = languageSelect.value;
                    recognition.start();
                } catch (e) {
                    console.log(e);
                }
            } else {
                statusText.innerHTML = "Status: Recording stopped successfully.";
                startBtn.style.display = "block";
                stopBtn.style.display = "none";
            }
        };

        window.startRecording = function() {
            isManualStop = false;
            finalTranscript = outputBox.value ? outputBox.value + " " : "";
            recognition.lang = languageSelect.value;
            try {
                recognition.start();
            } catch (e) {
                console.log(e);
            }
        };

        window.stopRecording = function() {
            isManualStop = true;
            try {
                recognition.stop();
            } catch (e) {
                console.log(e);
            }
        };

    } else {
        statusText.innerHTML = "❌ Browser does not support voice recognition.";
        startBtn.disabled = true;
    }

    function refineText() {
        let text = outputBox.value;
        // অতিরিক্ত স্পেস এবং ডুপ্লিকেট শব্দ দূর করা
        let words = text.split(/\s+/);
        let cleanedWords = [];
        for (let i = 0; i < words.length; i++) {
            if (i === 0 || words[i] !== words[i - 1]) {
                cleanedWords.push(words[i]);
            }
        }
        text = cleanedWords.join(' ');
        outputBox.value = text;
        finalTranscript = text;
        statusText.innerHTML = "Status: Text cleaned!";
    }

    function clearText() {
        outputBox.value = "";
        finalTranscript = "";
        statusText.innerHTML = "Status: Text cleared.";
    }
</script>

</body>
</html>
